version: '3'

services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: trip_planner
      POSTGRES_USER: docker
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d trip_planner"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zdpai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - db
  
networks:
  app-network:
    driver: bridge

volumes:
  pg-data: